<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>증강 부루마블 v5</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0b1020;font-family:'Pretendard','Malgun Gothic','Apple SD Gothic Neo',sans-serif;color:#e8ecff;overflow:hidden;width:100vw;height:100vh;user-select:none}
#stage{position:absolute;left:0;top:0;width:1600px;height:1000px;transform-origin:0 0}
.screen{position:absolute;inset:0;display:none}
.screen.on{display:block}
.btn{background:linear-gradient(#4f6bff,#3449c9);color:#fff;border:none;border-radius:10px;padding:10px 18px;font-size:16px;font-weight:800;cursor:pointer;font-family:inherit;box-shadow:0 3px 0 #1f2b80}
.btn:hover{filter:brightness(1.15)}
.btn:disabled{background:#3a3f5c;box-shadow:none;cursor:not-allowed;color:#8a8fae}
.btn.gray{background:linear-gradient(#5a6185,#40466a);box-shadow:0 3px 0 #2a2e48}
.btn.gold{background:linear-gradient(#f5b72e,#d18b0c);box-shadow:0 3px 0 #8a5a00;color:#2a1a00}
/* menu */
#menu{background:radial-gradient(circle at 50% 30%,#2a3680,#0b1020 70%)}
#menu h1{position:absolute;top:150px;width:100%;text-align:center;font-size:96px;font-weight:900;letter-spacing:-2px;background:linear-gradient(#fff,#ffd54a);-webkit-background-clip:text;color:transparent;text-shadow:0 0 40px #ffd54a33}
#menu .sub{position:absolute;top:280px;width:100%;text-align:center;font-size:22px;color:#aab3e8}
#menu .box{position:absolute;top:360px;left:50%;transform:translateX(-50%);width:460px;display:flex;flex-direction:column;gap:14px}
#menu .box .btn{font-size:22px;padding:16px}
#menu .opt{background:#161d3d;border-radius:12px;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;font-size:17px}
#menu select{font-size:16px;padding:4px 8px;border-radius:6px;font-family:inherit}
#menu .ver{position:absolute;bottom:20px;right:30px;color:#6870a0}
/* board */
#board{position:absolute;left:20px;top:20px;width:960px;height:960px;display:grid;grid-template-columns:118px repeat(7,1fr) 118px;grid-template-rows:118px repeat(7,1fr) 118px;gap:3px;background:#1a2140;padding:3px;border-radius:14px}
.cell{background:#f6f3ea;color:#1b1b2b;border-radius:6px;position:relative;overflow:hidden;padding:20px 3px 3px;text-align:center}
.cell .band{position:absolute;left:0;right:0;top:0;height:15px;font-size:10px;color:#fff;font-weight:700;line-height:15px}
.cell .nm{font-weight:800;font-size:13px;line-height:1.15;word-break:keep-all}
.cell .pr{font-size:11px;color:#666;margin-top:1px}
.cell .lv{font-size:12px;margin-top:1px;font-weight:800}
.cell .own{position:absolute;bottom:0;left:0;right:0;height:7px}
.cell.special{background:#dfe5ff}
.cell.tour{background:#fff3d6}
.cell.corner{background:#2c3566;color:#fff;padding-top:26px}
.cell.corner .nm{font-size:17px}
.cell.corner .ic{font-size:30px}
.cell .ic{font-size:20px;line-height:1.1}
.cell .fest{position:absolute;top:16px;right:2px;font-size:16px}
.tokens{position:absolute;bottom:9px;left:0;right:0;display:flex;justify-content:center;gap:2px}
.tok{width:20px;height:20px;border-radius:50%;border:2px solid #fff;box-shadow:0 2px 4px #0008;transition:transform .1s}
.cell.pickable{cursor:pointer;outline:3px dashed #ffb300;outline-offset:-3px;animation:pulse .7s infinite alternate}
.cell.flash{animation:flash .5s 2}
@keyframes pulse{to{filter:brightness(1.2)}}
@keyframes flash{50%{background:#ffe680}}
#center{grid-column:2/9;grid-row:2/9;background:radial-gradient(#26316a,#121835);border-radius:10px;padding:18px 22px;display:flex;flex-direction:column;gap:12px;position:relative}
#ctitle{font-size:30px;font-weight:900;text-align:center;letter-spacing:-1px}
#cinfo{text-align:center;color:#aab3e8;font-size:15px}
#dice{display:flex;justify-content:center;gap:18px;margin-top:4px}
.die{width:84px;height:84px;background:#fff;border-radius:16px;color:#1a1a2e;font-size:50px;font-weight:900;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 0 #b8bdd6}
.die.roll{animation:shake .08s infinite}
@keyframes shake{50%{transform:rotate(12deg) scale(1.05)}}
#prompt{background:#0e1430cc;border-radius:12px;padding:14px;min-height:150px;display:flex;flex-direction:column;gap:10px;align-items:center;justify-content:center}
#ptext{font-size:18px;text-align:center;line-height:1.45}
#pbtns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
#potline{display:flex;justify-content:space-around;font-size:15px;color:#cfd6ff}
/* side */
#side{position:absolute;left:1000px;top:20px;width:580px;height:960px;display:flex;flex-direction:column;gap:9px}
.pcard{background:#161d3d;border-radius:12px;padding:9px 12px;border-left:7px solid var(--pc);position:relative}
.pcard.active{box-shadow:0 0 0 3px #ffd54a}
.pcard.dead{opacity:.35}
.pcard .top{display:flex;justify-content:space-between;align-items:baseline}
.pcard .pn{font-size:18px;font-weight:900}
.pcard .pm{font-size:18px;font-weight:900;color:#ffe08a}
.pcard .meta{font-size:12px;color:#9aa3d6;margin:2px 0 3px}
.aug{display:inline-block;padding:2px 7px;border-radius:6px;font-size:12px;margin:2px 3px 0 0;background:#262f5c;border:1px solid #c0c7d6;cursor:help}
.aug.G{border-color:#f5c542;color:#ffe08a}
.aug.P{border-color:#d08cff;color:#f5dcff;background:linear-gradient(90deg,#43307a,#24406b)}
.aug.off{opacity:.45;text-decoration:line-through}
.syn{display:inline-block;padding:1px 6px;border-radius:10px;font-size:11px;margin:2px 3px 0 0;background:#0f5132;color:#b8ffd9;cursor:help}
.syn.lo{background:#2a2f4a;color:#8f96bd}
#log{flex:1;overflow:auto;background:#10152e;border-radius:10px;padding:8px 10px;font-size:13px;line-height:1.55}
#log div{border-bottom:1px solid #1c2348;padding:1px 0}
#sidebtns{display:flex;gap:8px}
#sidebtns .btn{flex:1;font-size:14px;padding:8px}
/* tooltip */
#tip{position:absolute;z-index:200;background:#0a0e22f2;border:1px solid #4f6bff;border-radius:8px;padding:8px 10px;font-size:13px;max-width:300px;pointer-events:none;display:none;line-height:1.45}
/* modal */
.modal{position:absolute;inset:0;background:#000b;display:none;align-items:center;justify-content:center;z-index:100;flex-direction:column;gap:22px}
.modal.on{display:flex}
.mtitle{font-size:40px;font-weight:900}
.cards{display:flex;gap:26px}
.acard{width:310px;height:420px;border-radius:18px;padding:22px 20px;background:linear-gradient(#232c5a,#151b3a);border:4px solid #c0c7d6;cursor:pointer;transition:transform .15s;display:flex;flex-direction:column;gap:10px;animation:deal .35s backwards}
.acard:nth-child(2){animation-delay:.08s}.acard:nth-child(3){animation-delay:.16s}
.acard:hover{transform:translateY(-12px) scale(1.02)}
.acard.G{border-color:#f5c542;box-shadow:0 0 25px #f5c54255}
.acard.P{border-color:#d08cff;box-shadow:0 0 35px #d08cff77;background:linear-gradient(135deg,#3d2a73,#1d3a6b)}
.acard .tier{font-size:14px;font-weight:800;color:#aab3e8}
.acard .an{font-size:28px;font-weight:900;line-height:1.2}
.acard .ad{font-size:17px;line-height:1.5;flex:1}
.acard .tags{display:flex;gap:6px;flex-wrap:wrap}
.acard .tg{font-size:13px;padding:3px 8px;border-radius:8px;background:#0e1430}
.acard .cnd{font-size:13px;color:#ffb86b}
@keyframes deal{from{transform:translateY(60px) rotateY(90deg);opacity:0}}
.panel{background:#141a38;border-radius:16px;padding:24px 28px;width:1200px;max-height:860px;overflow:auto;font-size:15px;line-height:1.6}
.panel h2{font-size:26px;margin:6px 0}
.panel h3{font-size:19px;margin:12px 0 4px;color:#ffd54a}
.panel table{width:100%;border-collapse:collapse;font-size:14px}
.panel td,.panel th{border-bottom:1px solid #252d58;padding:4px 6px;text-align:left}
.float{position:absolute;font-weight:900;font-size:24px;pointer-events:none;animation:rise 1.3s forwards;z-index:90;text-shadow:0 2px 4px #000,0 0 8px #000;white-space:nowrap}
@keyframes rise{to{transform:translateY(-60px);opacity:0}}
#toast{position:absolute;top:30px;left:500px;transform:translateX(-50%);background:#ffd54a;color:#231a00;font-weight:900;font-size:24px;padding:12px 26px;border-radius:14px;z-index:95;display:none;box-shadow:0 6px 20px #0008}
.shake{animation:sh .35s}
@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.rank{display:flex;flex-direction:column;gap:10px;width:900px}
.rrow{display:flex;align-items:center;gap:16px;background:#161d3d;border-radius:12px;padding:14px 20px;font-size:20px;border-left:8px solid var(--pc)}
.rrow .rk{font-size:32px;font-weight:900;width:60px}
.hl{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:900px}
.hl div{background:#1d2550;border-radius:10px;padding:10px 14px;font-size:16px}
.cell{transition:transform .15s}
.cell:hover{transform:translateY(-5px);z-index:3}
.cell .flag{position:absolute;top:17px;left:5px;width:3px;height:22px;background:#333;border-radius:2px;z-index:2}
.cell .flag::after{content:'';position:absolute;left:3px;top:0;width:15px;height:11px;background:var(--fc);clip-path:polygon(0 0,100% 50%,0 100%)}
.cell .flag.plant{animation:plant .55s cubic-bezier(.3,1.6,.5,1)}
@keyframes plant{from{transform:translateY(-46px) scale(1.8);opacity:0}}
#tokLayer{position:absolute;inset:0;pointer-events:none;z-index:20}
.tok{position:absolute;left:0;top:0;width:24px;height:24px;border-radius:50%;border:3px solid #fff;box-shadow:0 3px 6px #0008;transition:transform .35s cubic-bezier(.34,1.56,.64,1),opacity .4s;font-size:12px;color:#222;font-weight:900;display:flex;align-items:center;justify-content:center}
#dice{display:flex;justify-content:center;gap:34px;perspective:700px;height:96px;margin-top:4px}
#dice.land{animation:dl .25s}
@keyframes dl{50%{transform:translateY(4px)}}
.cube{width:84px;height:84px;position:relative;transform-style:preserve-3d}
.face{position:absolute;inset:0;background:linear-gradient(145deg,#fff,#e6e9f6);border-radius:16px;border:2px solid #cfd4ea;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:11px;backface-visibility:hidden}
.pip{width:15px;height:15px;border-radius:50%;background:#1a1a2e;align-self:center;justify-self:center}
.pip.red{background:#e11d48;width:22px;height:22px}
#fx{position:absolute;left:0;top:0;width:1600px;height:1000px;z-index:97;pointer-events:none}
#vig{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 45%,#ff1f3d99);opacity:0;pointer-events:none;z-index:94}
#banner{position:absolute;left:500px;top:420px;transform:translate(-50%,-50%);font-size:68px;font-weight:900;pointer-events:none;opacity:0;z-index:96;white-space:nowrap;color:#ffd54a;-webkit-text-stroke:3px #1a1440;paint-order:stroke;text-shadow:0 7px 0 #1a1440}
#banner.warn{color:#ff6b6b}
#banner.syn{color:#7dffb0;font-size:52px}
.coin{position:absolute;left:0;top:0;width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff7c2,#f5b72e 55%,#a86f00);border:2px solid #7a5200;z-index:96;pointer-events:none}
.stamp{position:absolute;transform:translate(-50%,-50%) rotate(-14deg);font-size:30px;font-weight:900;color:#e11d48;border:4px solid #e11d48;border-radius:8px;padding:2px 10px;background:#fff8;z-index:93;pointer-events:none;animation:stamp .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes stamp{from{transform:translate(-50%,-50%) rotate(-14deg) scale(3);opacity:0}}
.bfx{position:absolute;font-size:48px;z-index:92;pointer-events:none}
.pillar{position:absolute;width:80px;height:620px;transform-origin:bottom;background:linear-gradient(to top,#fff,#d6b4ffaa 40%,transparent);border-radius:40px;pointer-events:none;z-index:91}
#keyfx{position:absolute;left:500px;top:470px;transform:translate(-50%,-50%);z-index:93;display:none;pointer-events:none;flex-direction:column;align-items:center}
#keyfx.on{display:flex}
.kkey{font-size:90px;animation:kspin .6s ease-out}
@keyframes kspin{from{transform:rotate(-220deg) scale(.3);opacity:0}}
.kcard{width:380px;padding:18px;border-radius:16px;text-align:center;animation:kflip .5s .35s backwards cubic-bezier(.3,1.4,.5,1);margin-top:-6px;border:4px solid #fff;box-shadow:0 10px 30px #0009}
.kcard.good{background:linear-gradient(#fff3c4,#f5c542);color:#3a2800}
.kcard.bad{background:linear-gradient(#ffd6d6,#e25555);color:#3a0000}
@keyframes kflip{from{transform:rotateX(90deg) scale(.5);opacity:0}}
.kt{font-size:14px;font-weight:800;opacity:.7}.kn{font-size:30px;font-weight:900}.kd{font-size:17px;margin-top:4px}
.pcard.active::before{content:'';position:absolute;inset:-3px;border-radius:14px;border:3px solid #ffd54a;box-shadow:0 0 18px #ffd54a99;animation:gl 1.1s infinite alternate;pointer-events:none}
@keyframes gl{from{opacity:.35}}
.pcard.active{box-shadow:none}
.pm{display:inline-block}
.pm.up{animation:mup .7s}.pm.down{animation:mdn .7s}
@keyframes mup{30%{color:#7dff8a;transform:scale(1.18)}}
@keyframes mdn{30%{color:#ff7b7b;transform:scale(.9)}}
.pcard.broken{animation:crack 1s forwards}
.pcard.broken::after{content:'';position:absolute;inset:0;border-radius:12px;pointer-events:none;background:linear-gradient(115deg,transparent 48%,#000c 49%,#000c 50.3%,transparent 51.3%),linear-gradient(62deg,transparent 62%,#000c 63%,#000c 64%,transparent 65%)}
@keyframes crack{0%{transform:none}10%{transform:translateX(-9px) rotate(-1deg)}20%{transform:translateX(9px) rotate(1deg)}30%{transform:translateX(-5px)}40%{transform:none;filter:grayscale(0)}100%{filter:grayscale(1)}}
.syn.pop{animation:spop .45s 3}
@keyframes spop{50%{transform:scale(1.35);background:#22c55e;color:#fff}}
#log div.new{animation:slin .3s ease-out}
@keyframes slin{from{transform:translateY(-14px);opacity:0}}
#log div.imp{background:#2a2350;border-left:3px solid #ffd54a;padding-left:6px}
.btn{transition:transform .08s,filter .1s}
.btn:active{transform:translateY(3px) scale(.97);box-shadow:none}
#pbtns .btn{animation:bpop .3s cubic-bezier(.3,1.6,.5,1) backwards}
#pbtns .btn:nth-child(2){animation-delay:.05s}#pbtns .btn:nth-child(3){animation-delay:.1s}
@keyframes bpop{from{transform:scale(.6);opacity:0}}
.awrap{width:310px;height:420px;perspective:1100px;cursor:pointer;animation:deal2 .45s cubic-bezier(.3,1.3,.5,1) backwards}
@keyframes deal2{from{transform:translateY(420px) rotate(-12deg);opacity:0}}
.ain{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .55s cubic-bezier(.3,1.4,.5,1);transform:rotateY(180deg)}
.ain.open{transform:rotateY(0deg)}
.awrap:hover .ain.open{transform:translateY(-14px) rotateY(0deg)}
.aback{position:absolute;inset:0;border-radius:18px;background:repeating-linear-gradient(45deg,#2a3577 0 14px,#223066 14px 28px);border:4px solid #8090ff;transform:rotateY(180deg);backface-visibility:hidden;display:flex;align-items:center;justify-content:center}
.aq{font-size:120px;font-weight:900;color:#ffffff30}
.ain .acard{position:absolute;inset:0;width:auto;height:auto;animation:none;backface-visibility:hidden;overflow:hidden}
.ain .acard:hover{transform:none}
.ain .acard::after{content:'';position:absolute;top:0;bottom:0;left:-60%;width:60%;background:linear-gradient(105deg,transparent,#ffffff40,transparent);animation:shine 2.4s infinite;pointer-events:none}
.ain .acard.G::after{background:linear-gradient(105deg,transparent,#ffe08a66,transparent)}
.ain .acard.P::after{left:-100%;width:300%;background:linear-gradient(110deg,#ff9ff333,#7df9ff33,#fff59d33,#c3a6ff33,#ff9ff333);animation:holo 3s linear infinite}
@keyframes shine{0%,40%{transform:translateX(0)}100%{transform:translateX(330%)}}
@keyframes holo{to{transform:translateX(33%)}}
.rrow{animation:rin .5s cubic-bezier(.3,1.4,.5,1) backwards}
@keyframes rin{from{transform:translateX(-120px);opacity:0}}
.crown{display:inline-block;animation:cb .8s infinite alternate}
@keyframes cb{to{transform:translateY(-6px) rotate(8deg)}}


#lobby{background:radial-gradient(circle at 50% 30%,#2a3680,#0b1020 70%)}
.lbox{position:absolute;top:110px;left:50%;transform:translateX(-50%);width:560px;display:flex;flex-direction:column;gap:14px}
.lbox h2{font-size:46px;font-weight:900;text-align:center;margin-bottom:6px}
.lbox .opt{background:#161d3d;border-radius:12px;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:17px}
.lbox input{font-size:18px;padding:6px 10px;border-radius:8px;border:none;font-family:inherit;width:220px}
.lbox select{font-size:16px;padding:4px 8px;border-radius:6px;font-family:inherit}
.codebox{background:#161d3d;border-radius:12px;padding:14px;text-align:center;font-size:20px}
.codebox b{font-size:44px;letter-spacing:8px;color:#ffd54a;margin:0 12px}
.lrow{background:#161d3d;border-left:7px solid var(--pc);border-radius:10px;padding:10px 14px;font-size:19px;animation:rin .35s backwards}
.lrow.empty{border-left-color:#333a5c;color:#6870a0;font-size:15px}
#lobMsg{text-align:center;color:#ffb3b3;font-size:17px;min-height:24px}
</style>

</head>
<body>
<div id="stage">
  <div id="menu" class="screen on">
    <h1>증강 부루마블</h1>
    <div class="sub">한국 지도판 · 증강 3택 1 · 선택마다 새로고침 1회</div>
    <div class="box">
      <div class="opt">AI 상대 수 <select id="optAI"><option value="1">1명</option><option value="2">2명</option><option value="3" selected>3명</option></select></div>
      <div class="opt">라운드 제한 <select id="optLim"><option value="15">15라운드 (짧게)</option><option value="20" selected>20라운드</option><option value="25">25라운드</option></select></div>
      <div class="opt">AI 속도 <select id="optSpd"><option value="1.6">느리게</option><option value="1" selected>보통</option><option value="0.5">빠르게</option></select></div>
      <button class="btn gold" onclick="startSingle()">싱글 플레이</button>
      <button class="btn" onclick="showLobby()">멀티 플레이</button>
      <button class="btn gray" onclick="showHelp()">게임 방법</button>
      <button class="btn gray" onclick="showDex()">증강 · 시너지 도감</button>
    </div>
    <div class="ver">v5</div>
  </div>

  <div id="lobby" class="screen">
    <div class="lbox">
      <h2>🌐 멀티 플레이</h2>
      <div class="opt">닉네임 <input id="nick" maxlength="8" placeholder="최대 8자"></div>
      <div id="lobStart" style="display:flex;flex-direction:column;gap:12px">
        <button class="btn gold" onclick="hostRoom()">방 만들기</button>
        <div class="opt">방 코드 <input id="joinCode" maxlength="6" placeholder="예: K7QX2" style="text-transform:uppercase"><button class="btn" onclick="joinRoom()">참가</button></div>
        <button class="btn gray" onclick="location.reload()">뒤로</button>
      </div>
      <div id="lobRoom" style="display:none;flex-direction:column;gap:12px">
        <div class="codebox">방 코드 <b id="roomCode">-----</b> <button class="btn gray" onclick="copyCode()">복사</button></div>
        <div id="roomList"></div>
        <div id="hostCtl" style="display:none;flex-direction:column;gap:10px">
          <div class="opt">총 인원 (빈자리는 AI) <select id="optTotal"><option value="2">2명</option><option value="3">3명</option><option value="4" selected>4명</option></select></div>
          <div class="opt">라운드 제한 <select id="optLimM"><option value="15">15라운드</option><option value="20" selected>20라운드</option><option value="25">25라운드</option></select></div>
          <button class="btn gold" onclick="startMulti()">게임 시작</button>
        </div>
        <div id="waitMsg" style="display:none;text-align:center;color:#aab3e8;font-size:18px">방장이 시작하기를 기다리는 중...</div>
        <button class="btn gray" onclick="location.reload()">나가기</button>
      </div>
      <div id="lobMsg"></div>
    </div>
  </div>

  <div id="game" class="screen">
    <div id="board"></div><div id="tokLayer"></div>
    <div id="side">
      <div id="plist" style="display:flex;flex-direction:column;gap:8px"></div>
      <div id="log"></div>
      <div id="sidebtns">

function mods(p){

  const add=o=>{for(const k in o)if(k in m)m[k]+=o[k]};
  for(const id of p.augs){const a=AUGS[id];if(a.cond&&!a.cond(p))continue;add(a.m)}
  const sc=synCounts(p);
  for(const t in SYN){let best=null;for(const tier of SYN[t])if((sc[t]||0)>=tier[0])best=tier;if(best)add(best[1])}
  for(const k in CAPS)if(m[k]>CAPS[k])m[k]=CAPS[k];
  return m;
}
function invested(i){return G.cells[i].invested}
function asset(p){let s=p.cash;G.cells.forEach((c,i)=>{if(c.owner===p.id)s+=c.invested});return s}
function buyCost(p,i){return Math.round(CELLS[i].price*(1-mods(p).buyDisc/100))}
function lvCost(p,i,lv){const m=mods(p);let c=CELLS[i].price*BUILD_K[lv]*(1-m.buildDisc/100);if(lv===4)c*=(1-m.lmDisc/100);return Math.round(c)}
function baseToll(i){
  const c=G.cells[i],cell=CELLS[i];if(c.owner<0)return 0;
  const o=G.players[c.owner];let t;
  if(cell.t==='tour'){const cnt=TOURS.filter(j=>G.cells[j].owner===o.id).length;t=cell.price*0.5*cnt*(1+mods(o).tourIn/100)}
  else t=cell.price*TOLL_K[c.level];
  if(G.fest===i)t*=2+mods(o).festX;
  return Math.round(t);
}
function takeoverCost(p,i){return Math.round(invested(i)*1.5*(1-mods(p).toCost/100))}

function fit(){const s=Math.min(innerWidth/1600,innerHeight/1000);const st=document.getElementById('stage');st.style.transform=`scale(${s})`;st.style.left=((innerWidth-1600*s)/2)+'px';st.style.top=((innerHeight-1000*s)/2)+'px'}

function gridPos(i){
  if(i<=8)return[9,9-i]; if(i<=16)return[9-(i-8),1]; if(i<=24)return[1,1+(i-16)]; return[1+(i-24),9];
}

function cellTip(i){
  const cell=CELLS[i];if(!G)return cell.n;const c=G.cells[i];
  if(cell.t==='land'||cell.t==='tour'){
    let s=`<b>${cell.n}</b> ${cell.g?'· '+GROUPS[cell.g].n:'· 관광지'}<br>가격 ${cell.price}`;
    if(cell.t==='land')s+=`<br>통행료: `+TOLL_K.map((k,l)=>`${LV_NAMES[l]} ${Math.round(cell.price*k)}`).join(' / ');
    else s+=`<br>통행료: 가격×0.5×보유 관광지 수 (인수 불가, 건설 불가)`;
    if(c.owner>=0)s+=`<br>소유: ${G.players[c.owner].name} (${LV_NAMES[c.level]}) · 현재 통행료 <b>${baseToll(i)}</b>`;
    if(G.fest===i)s+='<br>🎉 축제 중 (통행료 ×2 이상)';
    return s;
  }
  const desc={start:`지나갈 때 월급 ${SALARY}`,island:`${ISLAND_TURNS}턴 동안 갇힘 (더블이면 탈출)`,key:'황금열쇠 카드를 뽑음',fest:'사회복지기금을 받고, 내 가장 비싼 땅에서 축제 개최 (통행료 ×2)',express:'다음 턴에 원하는 칸으로 이동',qa:`벌금 ${QA_FINE}을 사회복지기금에 냄`};
  return `<b>${cell.n}</b><br>${desc[cell.t]||''}`;
}
function render(){
  if(!G)return;
  renderCells();positionTokens();renderPlayers();
  document.getElementById('cinfo').innerHTML=`라운드 <b>${G.round}</b> / ${G.limit} · 현재 차례: <b style="color:${cur().color}">${cur().name}</b>`;
  document.getElementById('potline').innerHTML=`<span>🤝 사회복지기금: <b>${G.pot}</b></span><span>🎉 축제: <b>${G.fest>=0?CELLS[G.fest].n:'없음'}</b></span>`;
}
function renderCells(){
  CELLS.forEach((cell,i)=>{
    const d=cellEl(i),c=G.cells[i];
    let cls='cell';if(i%8===0)cls+=' corner';else if(cell.t==='tour')cls+=' tour';else if(cell.t!=='land')cls+=' special';
    if(G.pickSet&&G.pickSet.includes(i))cls+=' pickable';
    let h='';
    if(cell.t==='land')h+=`<div class="band" style="background:${GROUPS[cell.g].c}">${GROUPS[cell.g].n}</div>`;
    if(cell.t==='tour')h+=`<div class="band" style="background:#c98a00">관광지</div>`;
    if(cell.ic)h+=`<div class="ic">${cell.ic}</div>`;
    h+=`<div class="nm">${cell.n}</div>`;
    if(cell.price){if(c.owner>=0)h+=`<div class="pr">통행료 <b>${baseToll(i)}</b></div>`;else h+=`<div class="pr">${cell.price}</div>`}
    if(cell.t==='land'&&c.owner>=0&&c.level>0)h+=`<div class="lv">${LV_IC[c.level]} ${LV_NAMES[c.level]}</div>`;
    if(i===29&&G.pot)h+=`<div class="pr">기금 ${G.pot}</div>`;
    if(G.fest===i)h+=`<div class="fest">🎉</div>`;
    if(c.owner>=0){const oc=G.players[c.owner].color;h+=`<div class="flag" style="--fc:${oc}"></div><div class="own" style="background:${oc}"></div>`}
    const bs=c.owner>=0?`inset 0 0 0 3px ${G.players[c.owner].color}`:'';
    const key=cls+'|'+h+'|'+bs;
    if(CELLCACHE[i]!==key){CELLCACHE[i]=key;d.className=cls;d.innerHTML=h;d.style.boxShadow=bs}
    if(PREVOWN[i]!==c.owner){if(c.owner>=0&&PREVOWN[i]!==undefined){const f=d.querySelector('.flag');if(f)f.classList.add('plant')}PREVOWN[i]=c.owner}
  });
}
function buildPlayers(){
  document.getElementById('plist').innerHTML=G.players.map(p=>`<div class="pcard" id="pc${p.id}" style="--pc:${p.color}"><div class="top"><span class="pn">${p.name}${isMe(p)?' (나)':''}</span><span class="pm"></span></div><div class="meta"></div><div class="augs"></div><div class="syns"></div></div>`).join('');

function renderPlayers(){
  G.players.forEach(p=>{
    const el=cardEl(p);if(!el)return;
    const cls='pcard'+(p.id===G.turn&&!G.over&&p.alive?' active':'')+(p.alive?'':' dead broken');
    if(el.className!==cls)el.className=cls;
    tweenMoney(p,el.querySelector('.pm'));
    const m=mods(p),sc=synCounts(p);
    const st=[];if(p.toProt)st.push(`🛡인수방어 ${p.toProt}`);if(p.shield)st.push(`💖파산방지 ${p.shield}`);if(p.island)st.push(`🏝️무인도 ${p.island}`);if(p.express)st.push('🚀우주여행 대기');if(m.liarFree&&p.liarCharge)st.push('📒외상 1');
    setIf(el.querySelector('.meta'),`총자산 ${asset(p).toLocaleString()} · 땅 ${G.cells.filter(c=>c.owner===p.id).length}칸 · 증강 ${p.augs.length}/${MAX_PICKS}+ ${st.join(' · ')}${p.alive?'':' · 파산'}`);
    setIf(el.querySelector('.augs'),p.augs.map(id=>{const a=AUGS[id];const off=a.cond&&!a.cond(p);return `<span class="aug ${a.t}${off?' off':''}" data-tip="${esc(`<b>${a.n}</b> (${TIER_NAME[a.t]})<br>${a.d}<br><i>${a.tags.map(t=>'#'+t).join(' ')}</i>${off?'<br><span style=color:#ff9>조건 미충족 — 비활성</span>':''}`)}">${a.n}</span>`}).join('')||'<span style="color:#666;font-size:12px">증강 없음</span>');
    setIf(el.querySelector('.syns'),Object.keys(sc).filter(t=>SYN[t]).map(t=>{const lvl=synLv(p,t);const tip=SYN[t].map(x=>`${x[0]}개: ${x[2]}`).join('<br>');return `<span class="syn${lvl?'':' lo'}${p._synFlash===t?' pop':''}" data-tip="${esc('<b>#'+t+' 시너지</b><br>'+tip)}">#${t} ${sc[t]}</span>`}).join(''));
  });
}

const CELLCACHE=[],PREVOWN=[];
const PIPS={1:[5],2:[1,9],3:[1,5,9],4:[1,3,7,9],5:[1,3,5,7,9],6:[1,3,4,6,7,9]};
const FACE_T={1:'rotateY(0deg)',2:'rotateY(90deg)',3:'rotateX(90deg)',4:'rotateX(-90deg)',5:'rotateY(-90deg)',6:'rotateY(180deg)'};
const SHOW={1:[0,0],2:[0,-90],3:[-90,0],4:[90,0],5:[0,90],6:[0,180]};
function cubeHTML(){return [1,2,3,4,5,6].map(v=>`<div class="face" style="transform:${FACE_T[v]} translateZ(42px)">${PIPS[v].map(k=>`<i class="pip${v===1?' red':''}" style="grid-row:${Math.ceil(k/3)};grid-column:${(k-1)%3+1}"></i>`).join('')}</div>`).join('')}
const cellEl=i=>document.getElementById('cell'+i);
const cardEl=p=>document.getElementById('pc'+p.id);
const STAGE=()=>document.getElementById('stage');
const PART=[];let partRun=false;
function partLoop(){
  const cv=document.getElementById('fx'),ctx=cv.getContext('2d');ctx.clearRect(0,0,1600,1000);
  for(let k=PART.length-1;k>=0;k--){const q=PART[k];q.x+=q.vx;q.y+=q.vy;q.vy+=q.g;q.vx*=0.99;q.life-=q.dec;if(q.life<=0||q.y>1020){PART.splice(k,1);continue}
    ctx.globalAlpha=Math.max(0,q.life);ctx.fillStyle=q.c;ctx.fillRect(q.x,q.y,q.s,q.s*(q.r||1))}
  ctx.globalAlpha=1;
  if(PART.length)requestAnimationFrame(partLoop);else{partRun=false;ctx.clearRect(0,0,1600,1000)}
}
const FX={
  k(){return ANIM_SPEED*(FAST?0.35:1)},
  d(ms){return Math.max(1,ms*FX.k())},
  wait(ms){return new Promise(r=>setTimeout(r,FX.d(ms)))},
  rect(el){const st=STAGE().getBoundingClientRect(),r=el.getBoundingClientRect(),s=st.width/1600;return{x:(r.left-st.left)/s,y:(r.top-st.top)/s,w:r.width/s,h:r.height/s}},
  center(el){const r=FX.rect(el);return{x:r.x+r.w/2,y:r.y+r.h/2}},
  anim(el,kf,ms,easing){return el.animate(kf,{duration:FX.d(ms),easing:easing||'cubic-bezier(.34,1.56,.64,1)',fill:'forwards'}).finished.catch(()=>{})},
  spawn(x,y,vx,vy,c,o={}){if(PART.length>=40)PART.shift();PART.push({x,y,vx,vy,c,life:1,dec:o.dec||0.015+Math.random()*0.01,s:o.s||4+Math.random()*5,g:o.g??0.15,r:o.r});if(!partRun){partRun=true;requestAnimationFrame(partLoop)}},
  burst(x,y,n,cols,o={}){for(let k=0;k<n;k++){const a=Math.random()*Math.PI*2,sp=(o.sp||5)*(0.4+Math.random());FX.spawn(x,y,Math.cos(a)*sp,Math.sin(a)*sp-(o.up||2),cols[k%cols.length],o)}},
  async dice(a,b){
    const cs=[document.getElementById('d1'),document.getElementById('d2')];
    await Promise.all([a,b].map((v,k)=>{const[x,y]=SHOW[v];const c=cs[k];c.getAnimations().forEach(z=>z.cancel());
      const sx=360*(2+k)+x,sy=360*(2-k)+y;c.style.transform=`rotateX(${x}deg) rotateY(${y}deg)`;
      return c.animate([{transform:'translateY(0) rotateX(0deg) rotateY(0deg)'},{transform:`translateY(-95px) rotateX(${sx*0.5}deg) rotateY(${sy*0.6}deg)`,offset:.45},{transform:`translateY(0) rotateX(${sx}deg) rotateY(${sy}deg)`,offset:.8},{transform:`translateY(-14px) rotateX(${sx}deg) rotateY(${sy}deg)`,offset:.9},{transform:`translateY(0) rotateX(${sx}deg) rotateY(${sy}deg)`}],{duration:FX.d(750),easing:'ease-out'}).finished.catch(()=>{})}));
    const dz=document.getElementById('dice');dz.classList.remove('land');void dz.offsetWidth;dz.classList.add('land');
  },
  banner(text,kind){
    const b=document.getElementById('banner');b.textContent=text;b.className=kind||'';
    b.getAnimations().forEach(z=>z.cancel());
    b.animate([{transform:'translate(-50%,-50%) scale(2.4)',opacity:0},{transform:'translate(-50%,-50%) scale(.92)',opacity:1,offset:.22},{transform:'translate(-50%,-50%) scale(1)',opacity:1,offset:.7},{transform:'translate(-50%,-75%) scale(1)',opacity:0}],{duration:FX.d(1100),easing:'ease-out'});
    FX.burst(500,420,16,kind==='warn'?['#ff6b6b','#fff']:kind==='syn'?['#7dffb0','#fff','#22c55e']:['#ffd54a','#fff','#ff9f43'],{sp:7});
    return FX.wait(550);
  },
  vignette(){const v=document.getElementById('vig');v.getAnimations().forEach(z=>z.cancel());v.animate([{opacity:0},{opacity:1,offset:.2},{opacity:0}],{duration:FX.d(900)})},
  coins(fromEl,toEl,amount){
    if(!fromEl||!toEl||amount<=0)return Promise.resolve();
    const a=FX.center(fromEl),b=FX.center(toEl);const n=Math.min(8,3+Math.floor(amount/150));const ps=[];
    for(let k=0;k<n;k++){const c=document.createElement('div');c.className='coin';STAGE().appendChild(c);
      const ox=(Math.random()-.5)*34,oy=(Math.random()-.5)*34,mx=(a.x+b.x)/2+ox,my=Math.min(a.y,b.y)-110-Math.random()*70;
      ps.push(c.animate([{transform:`translate(${a.x+ox-11}px,${a.y+oy-11}px) scale(.5)`,opacity:0},{transform:`translate(${a.x+ox-11}px,${a.y+oy-11}px) scale(1)`,opacity:1,offset:.12},{transform:`translate(${mx-11}px,${my-11}px) scale(1.2)`,offset:.5},{transform:`translate(${b.x-11}px,${b.y-11}px) scale(.7)`,opacity:1}],{duration:FX.d(650),delay:FX.d(k*45),easing:'ease-in-out',fill:'both'}).finished.catch(()=>{}).then(()=>c.remove()))}
    return Promise.all(ps);

  stamp(i,text){const c=FX.center(cellEl(i));const s=document.createElement('div');s.className='stamp';s.textContent=text;s.style.left=c.x+'px';s.style.top=c.y+'px';STAGE().appendChild(s);setTimeout(()=>s.remove(),FX.d(1300)+60);return FX.wait(500)},

      shakeBoard();FX.burst(cx,cy,30,['#fff','#ffd54a','#d6b4ff'],{sp:7,up:3})}
    const b=document.createElement('div');b.className='bfx';b.textContent=LV_IC[lv];b.style.left=cx+'px';b.style.top=(r.y+r.h*0.55)+'px';STAGE().appendChild(b);

  },
  async keyCard(k){const el=document.getElementById('keyfx');el.innerHTML=`<div class="kkey">🔑</div><div class="kcard ${k.good?'good':'bad'}"><div class="kt">황금열쇠</div><div class="kn">${k.n}</div><div class="kd">${k.d}</div></div>`;el.classList.add('on');
    setTimeout(()=>FX.burst(500,500,14,k.good?['#ffd54a','#fff']:['#ff6b6b','#555'],{sp:6}),FX.d(400));await FX.wait(1350);el.classList.remove('on')},
  async hop(p,ms){

    t.style.transition='none';t.style.transform=`translate(${x1}px,${y1}px)`;const corner=p.pos%8===0;

async function rollDice(p){

  if(a!==b&&Math.random()<m.dbl/100)b=a;
  await FX.dice(a,b);
  return[a,b];
}

    else{say(`${pname(p)} 생각 중...`);await sleep(300)}
    const[a,b]=await rollDice(p);const isD=a===b;
    if(p.island>0){
      if(isD){p.island=0;log(`${pname(p)} 더블! 무인도 탈출`);await FX.banner('탈출!');await moveSteps(p,a+b);await resolve(p);return}
      p.island--;log(`${pname(p)} 🏝️ 탈출 실패 (${a}+${b})`);FX.wave(8);render();await sleep(300);return;
    }
    if(isD){dbl++;if(dbl===3){FX.vignette();await FX.banner('3연속 더블!','warn');log(`${pname(p)} 3연속 더블 → 무인도`);await goIsland(p);return}await FX.banner(dbl===2?'DOUBLE ×2!':'DOUBLE!')}
    log(`${pname(p)} 🎲 ${a}+${b}=${a+b}${isD?' <b>더블!</b>':''}`);
    await moveSteps(p,a+b);
    await resolve(p);
    if(G.over||!p.alive)return;
    while(p.pending>0)await doPick(p);
    if(isD&&p.island===0&&!p.express){toast(`${p.name} 더블! 한 번 더`);continue}
    return;
  }
}

async function moveSteps(p,n){for(let k=0;k<n;k++){p.pos=(p.pos+1)%N;if(p.pos===0)passStart(p);renderCells();await FX.hop(p,150)}render()}
async function moveTo(p,dest){while(p.pos!==dest){p.pos=(p.pos+1)%N;if(p.pos===0)passStart(p);renderCells();await FX.hop(p,90)}render()}
async function goIsland(p){p.pos=8;await FX.fly(p,false);const m=mods(p);if(m.islandOut){log(`${pname(p)} 🏝️ 조기퇴소 증강으로 바로 탈출!`);return}p.island=ISLAND_TURNS;FX.wave(8);log(`${pname(p)} 🏝️ 무인도 (${ISLAND_TURNS}턴)`)}

function passStart(p){
  const m=mods(p);let s=SALARY+m.salary;
  if(m.lapGamble){if(Math.random()<0.5){s=Math.round(s*2.5);log(`${pname(p)} 🎰 한탕 성공! 월급 ×2.5`)}else{const ns=Math.round(s*0.3);p.stats.gambleLoss+=s-ns;s=ns;log(`${pname(p)} 🎰 한탕 실패… 월급 ×0.3`)}}
  if(m.interest)s+=Math.min(150,Math.round(p.cash*m.interest/100));
  p.cash+=s;floatAt(0,'+'+s,'#7dff8a');FX.coins(cellEl(0),cardEl(p),s);
  p.laps++;if(m.liarFree)p.liarCharge=1;
  if(p.picks+p.pending<MAX_PICKS){p.pending++;log(`${pname(p)} 🏁 월급 ${s} · 증강 선택권 획득!`)}else log(`${pname(p)} 🏁 월급 ${s}`);
}

function gain(p,v){p.cash+=v;floatAt(p.pos,'+'+v,'#7dff8a');FX.coins(cellEl(p.pos),cardEl(p),v)}

async function pay(p,amt,to){
  amt=Math.round(amt);if(amt<=0)return 0;
  if(p.cash<amt)await liquidate(p,amt);
  if(p.cash<amt){
    if(p.shield>0){p.shield--;const paid=p.cash;p.cash=0;if(to)to.cash+=paid;toast(`${p.name} 파산 방지 발동!`,'#ffb3d9');log(`${pname(p)} 💖 파산 방지 발동 — 남은 빚 ${amt-paid} 탕감`);render();return paid}
    const paid=p.cash;p.cash=0;if(to)to.cash+=paid;bankrupt(p,to);return paid;
  }
  p.cash-=amt;if(to)to.cash+=amt;
  floatAt(p.pos,'-'+amt,'#ff7b7b');
  return amt;
}
async function liquidate(p,need){
  const m=mods(p);const rate=0.5+m.sellRate/100;
  const own=G.cells.map((c,i)=>({c,i})).filter(x=>x.c.owner===p.id).sort((a,b)=>a.c.invested-b.c.invested);
  for(const {c,i} of own){
    if(p.cash>=need)break;
    const v=Math.round(c.invested*rate);p.cash+=v;
    log(`${pname(p)} 💸 ${CELLS[i].n} 급매 (+${v})`);
    c.owner=-1;c.level=0;c.invested=0;if(G.fest===i)G.fest=-1;
  }
  render();
}
function bankrupt(p,to){
  p.alive=false;
  G.cells.forEach((c,i)=>{if(c.owner===p.id){c.owner=-1;c.level=0;c.invested=0;if(G.fest===i)G.fest=-1}});
  shakeBoard();FX.vignette();toast(`${p.name} 파산!`,'#ff8a8a');log(`☠️ ${pname(p)} 파산!`);
  const el=cardEl(p);if(el){const c=FX.center(el);FX.burst(c.x,c.y,24,['#888','#555','#bbb'],{sp:6})}
  render();
  if(alive().length===1)endGame(`${alive()[0].name} 외 전원 파산`);
}

async function resolve(p){
  if(G.over||!p.alive)return;
  const i=p.pos,cell=CELLS[i],c=G.cells[i];
  flashCell(i);
  if(cell.t==='land'||cell.t==='tour'){
    if(c.owner<0)await offerBuy(p,i);
    else if(c.owner===p.id){if(cell.t==='land')await offerBuild(p,i,false)}
    else await payToll(p,i);
  }else if(cell.t==='key'){
    let k=KEYS[rnd(KEYS.length)];
    if(!k.good&&mods(p).keyGood){log(`${pname(p)} 🔑 '${k.n}' → 점쟁이 예언으로 다시 뽑기`);k=KEYS[rnd(KEYS.length)]}
    log(`${pname(p)} 🔑 황금열쇠 <b>${k.n}</b> — ${k.d}`);
    await FX.keyCard(k);
    if(p.human)await ask(`🔑 <b>${k.n}</b><br>${k.d}`,[{label:'확인',v:1}]);
    await k.f(p);
  }else if(cell.t==='island'){await goIsland(p)}
  else if(cell.t==='fest'){
    if(G.pot>0){gain(p,G.pot);log(`${pname(p)} 🎉 사회복지기금 ${G.pot} 획득!`);const c0=FX.center(cellEl(16));FX.burst(c0.x,c0.y,20,['#ffd54a','#fff7c2'],{sp:6,up:5});G.pot=0}
    const own=G.cells.map((c,j)=>j).filter(j=>G.cells[j].owner===p.id);
    if(own.length){
      let pick;
      if(p.human&&own.length>1)pick=await pickCell(p,own,'🎉 축제를 열 내 땅을 고르세요');
      else pick=own.sort((a,b)=>baseToll(b)-baseToll(a))[0];
      G.fest=pick;log(`${pname(p)} 🎉 <b>${CELLS[pick].n}</b>에서 축제 개최!`);toast(`🎉 ${CELLS[pick].n} 축제!`);render();FX.fireworks(pick);
    }
  }else if(cell.t==='express'){p.express=true;log(`${pname(p)} 🚀 다음 턴에 우주여행!`)}
  else if(cell.t==='qa'){const v=QA_FINE;const paid=await pay(p,v,null);G.pot+=paid;log(`${pname(p)} 🤝 사회복지기금 ${paid}`);FX.coins(cardEl(p),cellEl(29),paid)}
  render();checkWin();
}

async function offerBuy(p,i){
  const cell=CELLS[i],cost=buyCost(p,i);
  if(p.cash<cost){log(`${pname(p)} ${cell.n} 구매 자금 부족`);return}
  let yes;
  if(p.human)yes=await ask(`<b>${cell.n}</b> 구매? (${cost})`,[{label:`구매 ${cost}`,v:1,cls:'gold'},{label:'패스',v:0,cls:'gray'}]);
  else yes=aiWantBuy(p,i,cost);
  if(!yes){if(!p.human)log(`${pname(p)} ${cell.n} 패스`);return}
  await pay(p,cost,null);const c=G.cells[i];c.owner=p.id;c.level=0;c.invested=cost;
  log(`${pname(p)} 🏷️ <b>${cell.n}</b> 구매 (${cost})`);render();
  if(cell.t==='land')await offerBuild(p,i,true);
}
async function offerBuild(p,i,fresh){
  const c=G.cells[i];if(c.level>=4)return;
  const maxLv=c.level>=3?4:3;
  const opts=[];let cum=0;
  for(let lv=c.level+1;lv<=maxLv;lv++){cum+=lvCost(p,i,lv);opts.push({lv,cost:cum})}
  if(!opts.length)return;
  let target=0;
  if(p.human){
    target=await ask(`<b>${CELLS[i].n}</b>에 건설할까요? (현금 ${p.cash})`,[...opts.map(o=>({label:`${LV_IC[o.lv]} ${LV_NAMES[o.lv]}까지 ${o.cost}`,v:o.lv,disabled:o.cost>p.cash,tip:o.cost>p.cash?`현금이 ${o.cost-p.cash} 부족합니다`:'',cls:o.lv===4?'gold':''})),{label:'건설 안 함',v:0,cls:'gray'}]);
  }else target=aiBuild(p,opts);
  if(!target)return;
  const o=opts.find(x=>x.lv===target);await pay(p,o.cost,null);c.level=target;c.invested+=o.cost;
  log(`${pname(p)} 🏗️ ${CELLS[i].n} → ${LV_NAMES[target]} (${o.cost})`);
  render();
  await FX.build(i,target);
  if(target===4)toast(`🗼 ${p.name} ${CELLS[i].n} 랜드마크!`,'#d6b4ff');
}
async function payToll(p,i){
  const c=G.cells[i],owner=G.players[c.owner];
  if(!owner.alive)return;
  const om=mods(owner),pm=mods(p);
  let t=baseToll(i)*(1+om.tollIn/100);
  if(om.tollGamble){if(Math.random()<0.5){t*=1.8;log(`${pname(owner)} 🃏 블랙잭! 통행료 ×1.8`)}else{t*=0.6;log(`${pname(owner)} 🃏 블랙잭 실패 ×0.6`)}}
  t*=(1-pm.tollOut/100);t=Math.round(t);
  if(pm.liarFree&&p.liarCharge){p.liarCharge=0;toast(`📒 ${p.name} 외상! 통행료 면제`,'#ffcf8a');log(`${pname(p)} 📒 외상 장부로 ${CELLS[i].n} 통행료 ${t} 면제`);t=0}
  if(t>0){
    if(p.human)await ask(`<b>${owner.name}</b>의 ${CELLS[i].n}! 통행료 <b>${t}</b>`,[{label:'지불',v:1}]);else await sleep(200);
    const paid=await pay(p,t,owner);
    p.stats.tollOut+=paid;owner.stats.tollIn+=paid;
    log(`${pname(p)} → ${pname(owner)} 통행료 ${paid} (${CELLS[i].n})`);
    if(paid>=500){shakeBoard();FX.vignette()}
    render();
    await FX.coins(cardEl(p),cardEl(owner),paid);
    for(const q of alive())if(q!==p&&q!==owner){const sk=mods(q).rentSkim;if(sk){const v=Math.round(paid*sk/100);if(v>0){q.cash+=v;q.stats.tollIn+=v}}}
  }
  render();
  if(!p.alive||G.over)return;
  if(CELLS[i].t==='land'&&c.level<4&&c.owner!==p.id){
    const cost=takeoverCost(p,i);
    if(p.cash>=cost){
      let yes;
      if(p.human)yes=await ask(`<b>${CELLS[i].n}</b> 인수? (${cost}, ${owner.name}에게 지불)${owner.toProt?'<br><span style=color:#ff9>⚠ 상대 인수 방어 '+owner.toProt+'회 보유 — 막히면 돈은 안 나감</span>':''}`,[{label:`인수 ${cost}`,v:1,cls:'gold'},{label:'안 함',v:0,cls:'gray'}]);
      else yes=aiWantTakeover(p,i,cost,owner);
      if(yes){
        if(owner.toProt>0){owner.toProt--;toast(`🛡 ${owner.name} 인수 방어!`,'#9ad8ff');log(`${pname(owner)} 🛡 ${pname(p)}의 인수 시도를 막음`);await FX.stamp(i,'방어!');render();return}
        await pay(p,cost,owner);
        const fl=cellEl(i).querySelector('.flag');if(fl)await FX.anim(fl,[{transform:'none',opacity:1},{transform:'translateY(-40px) rotate(-60deg)',opacity:0}],300,'ease-in');
        c.owner=p.id;
        const bonus=Math.round(cost*mods(p).toBonus/100);if(bonus)gain(p,bonus);
        p.stats.toCnt++;if(cost>p.stats.bigTO)p.stats.bigTO=cost;
        toast(`⚔️ ${p.name}, ${CELLS[i].n} 인수!`,'#ffb36b');shakeBoard();
        log(`⚔️ ${pname(p)} ${CELLS[i].n} 인수 (${cost}${bonus?', 환급 '+bonus:''})`);render();
        FX.coins(cardEl(p),cardEl(owner),cost);
        await FX.stamp(i,'인수!');
        await offerBuild(p,i,false);
      }
    }
  }
}
async function chooseExpress(p){
  if(p.human)return await pickCell(p,CELLS.map((c,i)=>i).filter(i=>i!==24),'🚀 우주여행 — 이동할 칸을 클릭하세요');
  // AI: 업그레이드 가능한 내 땅 > 살 수 있는 빈 땅 > 출발
  const m=mods(p);let best=0,bs=-1;
  CELLS.forEach((cell,i)=>{if(i===24)return;const c=G.cells[i];let s=-1;
    if((cell.t==='land'||cell.t==='tour')&&c.owner<0&&p.cash>buyCost(p,i)+150)s=cell.price;
    else if(cell.t==='land'&&c.owner===p.id&&c.level<4)s=cell.price*1.2;
    else if(i===0)s=SALARY+m.salary-50;
    if(s>bs){bs=s;best=i}});
  return best;
}
function pickCell(p,set,text){
  return new Promise(res=>{G.pickSet=set;say(text);render();G.pickCell=i=>{G.pickSet=null;G.pickCell=null;say('');render();res(i)}});
}

// ---- 증강 선택 ----
function rollTier(p){
  const k=Math.min(p.picks,4);let [s,g,pr]=TIER_P[k];
  const al=alive();if(p.picks>0&&al.length>1){const minA=Math.min(...al.map(asset));if(asset(p)===minA){s-=10;g+=6;pr+=4}}
  const r=Math.random()*100;return r<s?'S':r<s+g?'G':'P';
}
function drawAugs(p,tier,exclude){
  let pool=AUGS.filter(a=>a.t===tier&&!p.augs.includes(a.id)&&!exclude.includes(a.id));
  if(pool.length<3)pool=AUGS.filter(a=>a.t===tier&&!p.augs.includes(a.id));
  return pool.sort(()=>Math.random()-0.5).slice(0,3).map(a=>a.id);
}
async function doPick(p,bonus){
  if(!bonus)p.pending--;
  const before={};for(const t in SYN)before[t]=synLv(p,t);
  const tier=rollTier(p);let opts=drawAugs(p,tier,[]);let rerolls=1;let choice;
  if(p.human)choice=await augModal(p,tier,opts);
  else{
    let sc=opts.map(id=>aiAugScore(p,id));
    if(rerolls&&Math.max(...sc)<tierVal(tier)+0.9){opts=drawAugs(p,tier,opts);rerolls=0;sc=opts.map(id=>aiAugScore(p,id));log(`${pname(p)} 🔄 증강 새로고침`)}
    choice=opts[sc.indexOf(Math.max(...sc))];await sleep(250);
  }
  const a=AUGS[choice];p.augs.push(choice);p.picks++;
  if(a.m.startCash)gain(p,a.m.startCash);
  if(a.m.lottery){const v=rnd(a.m.lottery===2?901:401);gain(p,v);log(`${pname(p)} 🎟️ 랜덤 획득 ${v}`)}
  if(a.m.toProt)p.toProt+=a.m.toProt;
  if(a.m.shield)p.shield+=a.m.shield;
  log(`${pname(p)} ✨ <span class="aug ${a.t}">${a.n}</span> 획득 (${TIER_NAME[a.t]})`);
  if(!p.human&&a.t==='P')toast(`${p.name} 프리즘 증강: ${a.n}`,'#e3c2ff');
  const el=cardEl(p);if(el){el.animate([{transform:'scale(1)'},{transform:'scale(1.04)'},{transform:'scale(1)'}],{duration:FX.d(350)});if(a.t!=='S'){const c=FX.center(el);FX.burst(c.x,c.y,a.t==='P'?18:10,a.t==='P'?['#ff9ff3','#7df9ff','#fff59d','#c3a6ff']:['#ffd54a','#fff'],{sp:5})}}
  let up=null;for(const t in SYN){const l=synLv(p,t);if(l>before[t])up=[t,l]}
  if(up){p._synFlash=up[0];render();await FX.banner(`#${up[0]} 시너지 ${up[1]}단계!`,'syn');setTimeout(()=>{p._synFlash=null;if(G)render()},1600)}
  render();
}

// ---- AI ----
function tierVal(t){return{S:1,G:2,P:3.2}[t]}
function aiAugScore(p,id){
  const a=AUGS[id],w=p.pers.w,sc=synCounts(p);let s=tierVal(a.t);
  for(const t of a.tags){s+=((w[t]||1)-1)*0.6;s+=Math.min(sc[t]||0,3)*0.35}
  if(a.g){if(ownsGroup(p,a.g))s+=0.8;else{const free=CELLS.some((c,i)=>c.g===a.g&&G.cells[i].owner<0);s-=free?0.4:1.3}}
  if(a.cond&&!a.g&&!a.cond(p))s-=0.5;
  // 상황: 현금 적으면 방어/경제 선호
  if(p.cash<600&&(a.tags.includes('방어')||a.tags.includes('경제')))s+=0.4;
  return s+Math.random()*0.3;
}
function aiWantBuy(p,i,cost){
  const res=p.pers.res;if(p.cash-cost<res*0.6)return false;
  const cell=CELLS[i];
  if(cell.g&&CELLS.some((c,j)=>c.g===cell.g&&G.cells[j].owner===p.id))return true;
  return p.cash-cost>=res||Math.random()<0.5;
}
function aiBuild(p,opts){
  let best=0;
  for(const o of opts){if(p.cash-o.cost>=p.pers.res*(o.lv===4?0.8:1))best=o.lv}
  if(p.pers.k==='land')for(const o of opts)if(p.cash-o.cost>=p.pers.res*0.6)best=Math.max(best,o.lv);
  return best;
}
function aiWantTakeover(p,i,cost,owner){
  if(p.cash-cost<p.pers.res)return false;
  const cell=CELLS[i];
  const completes=cell.g&&CELLS.every((c,j)=>c.g!==cell.g||j===i||G.cells[j].owner===p.id);
  if(completes)return true;
  const leader=alive().reduce((a,b)=>asset(a)>=asset(b)?a:b);
  let pr=p.pers.toP;if(p.pers.k==='jam'&&owner===leader)pr=0.95;
  if(owner.toProt)pr*=0.4;
  return Math.random()<pr;
}

// ---- 승리 ----
function checkWin(){
  if(G.over)return;
  for(const p of alive()){
    const full=Object.keys(GROUPS).filter(g=>CELLS.every((c,i)=>c.g!==g||G.cells[i].owner===p.id)).length;
    if(full>=3)return endGame(`${p.name} 트리플 독점!`,p);
    for(const s of SIDES)if(s.every(i=>G.cells[i].owner===p.id))return endGame(`${p.name} 라인 독점!`,p);
    if(TOURS.every(i=>G.cells[i].owner===p.id))return endGame(`${p.name} 관광지 독점!`,p);
  }
}
function endGame(reason,winner){
  if(G.over)return;G.over=true;render();
  const ranked=[...G.players].sort((a,b)=>(winner?(b===winner)-(a===winner):0)||(b.alive-a.alive)||asset(b)-asset(a));
  const top=(f)=>G.players.reduce((a,b)=>f(b)>f(a)?b:a);
  const tIn=top(p=>p.stats.tollIn),tOut=top(p=>p.stats.tollOut),to=top(p=>p.stats.bigTO),gl=top(p=>p.stats.gambleLoss),au=top(p=>p.augs.filter(id=>AUGS[id].t==='P').length);
  const n=ranked.length;
  const md=document.getElementById('endModal');
  md.innerHTML=`<div class="mtitle">🏆 ${reason}</div>
  <div class="rank">${ranked.map((p,k)=>`<div class="rrow" style="--pc:${p.color};animation-delay:${(n-1-k)*380}ms"><span class="rk">${k+1}</span><b style="flex:1">${p.name}${k===0?' <span class="crown">👑</span> MVP':''}${p.alive?'':' (파산)'}</b><span>총자산 ${asset(p).toLocaleString()}</span><span style="font-size:14px;color:#aab3e8">${p.augs.map(id=>AUGS[id].n).join(', ')}</span></div>`).join('')}</div>
  <div class="hl" style="animation:rin .5s ${n*380}ms backwards">
   <div>💰 통행료 수입왕: <b>${tIn.name}</b> (${tIn.stats.tollIn.toLocaleString()})</div>
   <div>😭 가장 운 나빴던 사람: <b>${tOut.name}</b> (통행료 ${tOut.stats.tollOut.toLocaleString()} 지불)</div>
   <div>⚔️ 최고 인수가: <b>${to.stats.bigTO?to.name+' ('+to.stats.bigTO.toLocaleString()+')':'인수 없음'}</b></div>
   <div>🎰 도박 손실왕: <b>${gl.stats.gambleLoss?gl.name+' ('+gl.stats.gambleLoss.toLocaleString()+')':'없음'}</b></div>
   <div>💎 프리즘 수집가: <b>${au.name}</b> (${au.augs.filter(id=>AUGS[id].t==='P').length}개)</div>
   <div>⏱️ 진행: ${Math.min(G.round,G.limit)}라운드</div>
  </div>
  <div style="display:flex;gap:12px"><button class="btn gold" onclick="location.reload()">메인으로</button><button class="btn gray" onclick="document.getElementById('endModal').classList.remove('on')">보드 보기</button></div>`;
  md.classList.add('on');
  setTimeout(()=>FX.confetti(),(n-1)*380+300);
}

// ---- 도감 / 규칙 ----

  md.innerHTML=`<div class="panel"><h2>증강 도감 (${AUGS.length}개)</h2>

  <div style="text-align:center;margin-top:12px"><button class="btn" onclick="document.getElementById('infoModal').classList.remove('on')">닫기</button></div></div>`;

}

  <h3>기본</h3>주사위 2개를 굴려 이동합니다. 더블이면 한 번 더 굴리고, 3연속 더블이면 무인도에 갇힙니다. 출발 칸을 지나면 월급 ${SALARY}을 받습니다. 시작 자금은 ${START_CASH}입니다.

  <h3>승리 조건</h3>① 나머지 전원 파산 ② 트리플 독점 (게임 그룹 3개 독점) ③ 라인 독점 (보드 한 변의 땅·관광지 전부) ④ 관광지 4곳 독점 ⑤ 라운드 제한 도달 시 총자산 1등
  <div style="text-align:center;margin-top:12px"><button class="btn" onclick="document.getElementById('infoModal').classList.remove('on')">닫기</button></div></div>`;

}
